[package]
name = "herdr-gui"
version = "0.1.11"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "herdr-gui"
path = "crates/herdr-gui/src/main.rs"

[workspace]
members = []
resolver = "2"

[workspace.package]
edition = "2021"
license = "MPL-2.0"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
crepuscularity-gpui = { version = "=0.5.5", features = ["macos"] }
libc = "0.2"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# SF Symbols only exist on macOS; gpui-symbols does not compile elsewhere.
[target.'cfg(target_os = "macos")'.dependencies]
crepuscularity-gpui = { version = "=0.5.5", features = ["symbols"] }

# gpui's default windows-manifest feature collides with the manifest gpui-ce embeds.
[target.'cfg(not(windows))'.dependencies]
gpui = "=0.2.2"

[target.'cfg(windows)'.dependencies]
gpui = { version = "=0.2.2", default-features = false }
interprocess = "2.4.2"

[lints]
workspace = true
